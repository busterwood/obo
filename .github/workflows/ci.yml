# CI for obx: build the compiler from the C seed and run the quick gate
# (obx/tools/gate.sh quick: the seed's fixed point, the conformance suite, the
# compiler tests, the library tests, the native backend against the C backend
# and the native self-build), then the eza golden suite on the native eza.
#
# obo 0.19 was retired on 2026-11-02 (archive/obo/); its CI steps, including
# the live eza differential against the pinned eza 0.23.3 release, went with
# it. The eza suite here uses the recorded goldens as the oracle.
#
# Deliberately not here: the full gate's red-team rounds under ASan+UBSan and
# the compiler fuzzer (obx/compiler/fuzz.py); they remain local gates.
name: ci

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: build and test (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the compiler from the C seed
        run: obx/compiler/build.sh

      - name: Run the quick gate
        run: bash obx/tools/gate.sh quick

      - name: Run the eza golden suite (native build)
        run: python3 obx/cmd/eza_gate.py -j 4
