# CI for obo: build the compiler and runtime from the promoted seed and run a
# fast, deterministic Linux subset of the full gate: documentation examples,
# the compiler suite, tools and their GNU coreutils differential, tool memory,
# incremental I/O (tools, runtime and programs), the ELF segment, symbol fuzz,
# home-directory checks, and the eza differential/memory once P0 and P4 land.
# The eza gates are gated on P0 (obo/tests/eza.py + obo/tests/eza/VERSION) and
# P4 (obo/cmd/eza.obx); until those land they skip with a clear message, so no
# live differential is claimed before P4.
#
# The eza release asset is downloaded outside the repository (into
# runner.temp/eza-ref) and verified against the pinned tarball and binary
# SHA-256 digests from obo/design/stdlib-eza-design-v7.md sections 3.1 and 10.1.
# It is never vendored into, or extracted inside, the checkout.
#
# Deliberately not here: the long mutation gates (tests/mutate_fork.py,
# tests/mutate_port.py, tests/mutate_io.py and, from P3, tests/mutate_meta.py),
# the long port gates (tests/port_compare.py, including OBO_REF=seed/obo, and
# tests/port_test.py) and bench/bench.py. They remain local/release gates
# because of their runtime (design section 11.2).
name: ci

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EZA_URL: https://github.com/eza-community/eza/releases/download/v0.23.3/eza_x86_64-unknown-linux-gnu.tar.gz
  EZA_TARBALL_SHA256: 02e818f7b06f2c637b25761731104f1e9d6ea8f6e5924ab05eae69db4ed072a5
  EZA_BINARY_SHA256: 10457dde35808517d09bcd3bfb6bc386000d06c2126e34b9071e09470a8f7cd8

jobs:
  linux:
    name: build and test (Linux x86-64)
    # Pin the image (not ubuntu-latest): tests/tools.py requires GNU coreutils
    # >= 9, and the pinned eza reference is a glibc x86-64 build. Ubuntu 24.04
    # provides both and keeps the runner surface stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Define the eza reference directory
        # `runner` is not a valid context in a job-level `env:` block, so
        # publish the directory once to every later step through GITHUB_ENV.
        run: echo "EZA_DIR=$RUNNER_TEMP/eza-ref" >> "$GITHUB_ENV"

      - name: Install and verify the pinned eza reference (P0+)
        # P0 commits both obo/tests/eza.py and obo/tests/eza/VERSION. Before
        # then, pre-P0 CI must not depend on the external download, so skip
        # cleanly. Exactly one of the two files is a malformed P0 state and
        # fails. Once both exist, any download/hash/version failure fails.
        run: |
          set -euo pipefail
          have=0
          if [ -f obo/tests/eza.py ]; then have=$((have + 1)); fi
          if [ -f obo/tests/eza/VERSION ]; then have=$((have + 1)); fi
          if [ -f obo/cmd/eza.obx ] && [ "$have" -ne 2 ]; then
            echo 'error: malformed stage state: own eza exists but the P0 harness is incomplete' >&2
            exit 1
          fi
          case "$have" in
            0)
              echo 'P0 eza harness not present yet; skipping the reference install'
              exit 0
              ;;
            2) ;;
            *)
              echo 'error: malformed P0 state: obo/tests/eza.py and obo/tests/eza/VERSION must both exist' >&2
              exit 1
              ;;
          esac
          mkdir -p "$EZA_DIR"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 \
            -o "$EZA_DIR/eza.tar.gz" "$EZA_URL"
          echo "$EZA_TARBALL_SHA256  $EZA_DIR/eza.tar.gz" | sha256sum -c -
          # Extract only the binary so the PATH directory stays minimal. The
          # archive names its only member ./eza (not eza); match that path.
          tar -xzf "$EZA_DIR/eza.tar.gz" -C "$EZA_DIR" ./eza
          echo "$EZA_BINARY_SHA256  $EZA_DIR/eza" | sha256sum -c -
          rm -f "$EZA_DIR/eza.tar.gz"
          # The pinned release prints exactly these three lines. The [+git]
          # suffix is part of the release string; do not normalize it.
          expected="$(printf '%s\n' \
            'eza - A modern, maintained replacement for ls' \
            'v0.23.3 [+git]' \
            'https://github.com/eza-community/eza')"
          actual="$("$EZA_DIR/eza" --version)"
          if [ "$actual" != "$expected" ]; then
            echo 'unexpected eza --version output:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          echo "$EZA_DIR" >> "$GITHUB_PATH"

      - name: Build the compiler and runtime
        run: make -C obo

      - name: Check the language documentation examples
        run: python3 obo/tests/doc_check.py

      - name: Run the compiler test suite
        run: python3 obo/tests/run_fork.py

      - name: Build the command-line tools
        run: make -C obo tools

      - name: Check incremental tool I/O (cat/wc streaming)
        run: python3 obo/tests/io_test.py --tools

      - name: Differential-test the tools against GNU coreutils
        run: python3 obo/tests/tools.py --require-reference

      - name: Run the tool memory cases
        run: python3 obo/tests/tools.py --memory

      - name: Check the ELF runtime-data segment
        run: python3 obo/tests/elf_test.py

      - name: Run the incremental I/O runtime and program cases
        run: python3 obo/tests/io_test.py --rt --programs

      - name: Run the symbol fuzz cases
        run: python3 obo/tests/sym_fuzz.py

      - name: Check home-directory handling
        run: python3 obo/tests/homes_check.py

      - name: Check home-directory edge cases
        run: python3 obo/tests/homes_edge.py

      - name: Differential-test eza against the pinned reference (P4+)
        # Active only when P0 (obo/tests/eza.py + obo/tests/eza/VERSION) and P4
        # (obo/cmd/eza.obx) have all landed. Before P0, skip cleanly; a
        # half-landed P0 harness is malformed and fails; after P0 but before
        # P4 there is no own eza to build, so skip with an explicit message.
        # Once active, --require-reference makes a missing/different reference
        # or any test failure fail the step (no fake pass).
        run: |
          set -euo pipefail
          have=0
          if [ -f obo/tests/eza.py ]; then have=$((have + 1)); fi
          if [ -f obo/tests/eza/VERSION ]; then have=$((have + 1)); fi
          if [ -f obo/cmd/eza.obx ] && [ "$have" -ne 2 ]; then
            echo 'error: malformed stage state: own eza exists but the P0 harness is incomplete' >&2
            exit 1
          fi
          case "$have" in
            0)
              echo 'P0 eza harness not present yet; skipping the differential'
              exit 0
              ;;
            2) ;;
            *)
              echo 'error: malformed P0 state: obo/tests/eza.py and obo/tests/eza/VERSION must both exist' >&2
              exit 1
              ;;
          esac
          if [ ! -f obo/cmd/eza.obx ]; then
            echo 'own eza not implemented (P4); skipping the differential'
            exit 0
          fi
          PATH="$EZA_DIR:$PATH" python3 obo/tests/eza.py --require-reference

      - name: Run the eza memory cases (P4+)
        # The same P0/P4 gate as the differential: --memory builds own eza, so
        # it cannot run before cmd/eza.obx exists.
        run: |
          set -euo pipefail
          have=0
          if [ -f obo/tests/eza.py ]; then have=$((have + 1)); fi
          if [ -f obo/tests/eza/VERSION ]; then have=$((have + 1)); fi
          if [ -f obo/cmd/eza.obx ] && [ "$have" -ne 2 ]; then
            echo 'error: malformed stage state: own eza exists but the P0 harness is incomplete' >&2
            exit 1
          fi
          case "$have" in
            0)
              echo 'P0 eza harness not present yet; skipping the memory cases'
              exit 0
              ;;
            2) ;;
            *)
              echo 'error: malformed P0 state: obo/tests/eza.py and obo/tests/eza/VERSION must both exist' >&2
              exit 1
              ;;
          esac
          if [ ! -f obo/cmd/eza.obx ]; then
            echo 'own eza not implemented (P4); skipping the memory cases'
            exit 0
          fi
          PATH="$EZA_DIR:$PATH" python3 obo/tests/eza.py --memory
